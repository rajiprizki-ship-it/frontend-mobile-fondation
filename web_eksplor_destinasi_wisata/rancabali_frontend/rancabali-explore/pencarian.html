<!DOCTYPE html>
<html lang="id">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="pencarian" data-nav="destinasi">
  <a class="skip" href="#main">Lewati ke konten utama</a>
  <header class="site-header" id="site-header"></header>
  <main id="main">
    <div class="container page">
      <a class="back" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg><span>Cari Destinasi</span></a>

  <footer class="site-footer" id="site-footer"></footer>
