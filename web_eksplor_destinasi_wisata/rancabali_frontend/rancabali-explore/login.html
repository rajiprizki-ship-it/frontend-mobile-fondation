<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk | Rancabali Explore</title>
  <meta name="description" content="Masuk atau daftar akun Rancabali Explore.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
  <main class="auth" id="main">
    <div class="auth__wrap">
      <div class="auth__brand">
        <a href="index.html" aria-label="Rancabali Explore, ke beranda">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M3 28 8 6l8 12 5-8 8 18Z"/></svg>
          <strong>RANCABALI EXPLORE</strong>
        </a>
        <span>Jelajah Keindahan Alam, Temukan Ceritamu</span>
      </div>
      <div class="auth__card">
        <h1>Masuk ke Akun Anda</h1>
        <p>Nikmati pengalaman menjelajah destinasi wisata Rancabali dengan lebih mudah.</p>
        <form class="form" id="form-login" novalidate>
          <div id="status" class="alert" role="status"></div>
          <div>
            <div class="field" data-icon="user">
              <label class="sr-only" for="id">Email atau username</label>
              <input id="id" name="id" type="text" placeholder="Email atau Username" autocomplete="username" aria-describedby="id-err">
            </div>
            <p class="field__error" id="id-err" role="alert"></p>
          </div>
          <div>
            <div class="field" data-icon="lock">
              <label class="sr-only" for="pw">Password</label>
              <input id="pw" name="pw" type="password" placeholder="Password" autocomplete="current-password" aria-describedby="pw-err">
              <button class="field__toggle" type="button" aria-label="Tampilkan password" aria-pressed="false"></button>
            </div>
            <p class="field__error" id="pw-err" role="alert"></p>
          </div>
          <div class="form__row">
            <label class="check"><input type="checkbox" id="ingat"> Ingat saya</label>
            <a href="#" id="lupa">Lupa password?</a>
          </div>
          <button class="btn btn--primary btn--block btn--lg" type="submit">Login</button>
          <p class="form__alt">Belum punya akun? <a href="register.html">Daftar di sini</a></p>
        </form>
      </div>
    </div>

  </main>
  <script src="js/data.js"></script>
  <script src="js/art.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
